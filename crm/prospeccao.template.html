<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funil Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">

<style id="app-css">
:root{
  --bg:#F4F3F6; --surface:#FFFFFF; --surface-2:#FAF9FB;
  --ink:#191822; --ink-2:#4A4756; --muted:#75718200; --muted-c:#757182;
  --line:#E4E1EA; --line-2:#EFEDF3;
  --accent:#C02B60; --accent-ink:#FFFFFF; --accent-soft:#FCEBF1;
  --overdue:#B02418; --overdue-soft:#FBEAE8;
  --today:#96540A; --today-soft:#FBF0E2;
  --win:#0E6E58; --win-soft:#E4F2EE;
  --s-novo:#7C7A8A; --s-contato:#6A5AA6; --s-conversa:#9B3F8F;
  --s-proposta:#C02B60; --s-ganho:#0E6E58; --s-perdido:#9A98A2;
  --shadow:0 1px 2px rgba(25,24,34,.06), 0 8px 24px rgba(25,24,34,.07);
  --shadow-sheet:0 -8px 40px rgba(25,24,34,.18);
  --r:14px; --r-sm:9px;
  --sp:16px;
  --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v4:#eda100;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131218; --surface:#1C1B22; --surface-2:#232128;
    --ink:#F1EFF4; --ink-2:#C3BFCC; --muted-c:#948FA0;
    --line:#2C2A34; --line-2:#26242D;
    --accent:#F27A9F; --accent-ink:#25101A; --accent-soft:#33202A;
    --overdue:#F08279; --overdue-soft:#331F1D;
    --today:#E0A458; --today-soft:#332818;
    --win:#5FC7AB; --win-soft:#17302B;
    --s-novo:#9995A6; --s-contato:#9A8AD8; --s-conversa:#D274C4;
    --s-proposta:#F27A9F; --s-ganho:#5FC7AB; --s-perdido:#7B7887;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.36);
    --shadow-sheet:0 -8px 40px rgba(0,0,0,.55);
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500;
  }
}
:root[data-theme="dark"]{
  --bg:#131218; --surface:#1C1B22; --surface-2:#232128;
  --ink:#F1EFF4; --ink-2:#C3BFCC; --muted-c:#948FA0;
  --line:#2C2A34; --line-2:#26242D;
  --accent:#F27A9F; --accent-ink:#25101A; --accent-soft:#33202A;
  --overdue:#F08279; --overdue-soft:#331F1D;
  --today:#E0A458; --today-soft:#332818;
  --win:#5FC7AB; --win-soft:#17302B;
  --s-novo:#9995A6; --s-contato:#9A8AD8; --s-conversa:#D274C4;
  --s-proposta:#F27A9F; --s-ganho:#5FC7AB; --s-perdido:#7B7887;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.36);
  --shadow-sheet:0 -8px 40px rgba(0,0,0,.55);
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.wrap{max-width:600px;margin:0 auto;padding:0 var(--sp) 132px;position:relative}

/* ---------- topo ---------- */
.top{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding-top:max(14px,env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
}
.top-in{max-width:600px;margin:0 auto;padding:0 var(--sp)}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0}
.saved{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted-c);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--win);flex:none}
.dot.pend{background:var(--today)}
.dot.off{background:var(--muted-c)}
.btn-save{
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  border-radius:99px;padding:5px 13px;font-size:13px;font-weight:700;
}
.btn-save[disabled]{opacity:.5}

.stats{display:flex;gap:18px;margin:12px 0 13px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-c);font-weight:600}
.stat.alerta b{color:var(--overdue)}

.tabs{display:flex;gap:4px}
.tab{
  flex:1;background:none;border:none;padding:11px 4px 12px;border-bottom:2.5px solid transparent;
  font-size:14.5px;font-weight:600;color:var(--muted-c);border-radius:6px 6px 0 0;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:12px;color:var(--muted-c);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .n{color:var(--accent)}

/* ---------- avisos ---------- */
.aviso{
  margin:14px 0 0;padding:11px 13px;border-radius:var(--r-sm);font-size:13.5px;
  background:var(--today-soft);color:var(--today);border:1px solid color-mix(in srgb,var(--today) 25%,transparent);
}
.aviso.erro{background:var(--overdue-soft);color:var(--overdue);border-color:color-mix(in srgb,var(--overdue) 25%,transparent)}

/* ---------- listas ---------- */
.grupo{margin-top:26px}
.grupo-h{display:flex;align-items:center;gap:9px;margin:0 0 10px}
.grupo-h h2{
  font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;
  letter-spacing:.1em;margin:0;color:var(--ink-2);
}
.grupo-h .cnt{
  font-size:11.5px;font-weight:700;color:var(--muted-c);font-variant-numeric:tabular-nums;
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 8px;
}
.grupo-h .rule{flex:1;height:1px;background:var(--line)}
.grupo.urgente .grupo-h h2{color:var(--overdue)}
.grupo.hoje .grupo-h h2{color:var(--today)}

.cards{display:flex;flex-direction:column;gap:9px}
.card{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;
  transition:transform .12s ease;
}
.card:active{transform:scale(.988)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--stage,var(--s-novo))}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h3{font-family:var(--display);font-weight:600;font-size:16.5px;margin:0;letter-spacing:-.01em;line-height:1.25}
.valor{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--muted-c)}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink-2);white-space:nowrap;
}
.pill .bola{width:6px;height:6px;border-radius:50%;background:var(--stage,var(--s-novo))}
.pill.tipo{background:transparent}
.acao{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);line-height:1.35}
.acao .quando{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.acao.atrasado .quando{color:var(--overdue)}
.acao.hoje .quando{color:var(--today)}
.acao.vazio{color:var(--muted-c);font-style:italic}

.vazio-msg{
  text-align:center;padding:38px 20px;color:var(--muted-c);font-size:14.5px;
  border:1px dashed var(--line);border-radius:var(--r);line-height:1.6;
}
.vazio-msg b{display:block;font-family:var(--display);font-size:16px;color:var(--ink-2);margin-bottom:5px;font-weight:600}

/* ---------- contagem e alarme ---------- */
.conta{
  margin-top:18px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  margin:0 0 13px;padding:9px 12px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--line);
}
.conta b{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:-.01em}
.conta span{font-size:12.5px;color:var(--muted-c);font-weight:600}
.conta.quente{background:var(--today-soft);border-color:color-mix(in srgb,var(--today) 32%,transparent)}
.conta.quente b,.conta.quente span{color:var(--today)}

.alarme{
  display:flex;align-items:center;gap:11px;margin-top:18px;padding:13px 15px;
  border-radius:var(--r);background:var(--overdue-soft);
  border:1px solid color-mix(in srgb,var(--overdue) 34%,transparent);
}
.alarme .sino{font-size:20px;line-height:1;flex:none}
.alarme b{font-family:var(--display);font-weight:800;font-size:16px;color:var(--overdue);display:block;letter-spacing:-.01em}
.alarme span{font-size:13px;color:var(--overdue);opacity:.85}

/* ---------- cadência ---------- */
.cad{display:flex;flex-direction:column;gap:2px}
.cad-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.cad-item:last-child{border-bottom:none}
.cad-item .n{
  width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted-c);
}
.cad-item time{font-size:12px;font-weight:700;color:var(--muted-c);font-variant-numeric:tabular-nums;flex:none;width:44px}
.cad-item p{margin:0;flex:1;line-height:1.4}
.cad-item.feito .n{background:var(--win);border-color:var(--win);color:#fff}
.cad-item.feito p,.cad-item.feito time{opacity:.5;text-decoration:line-through}
.cad-item.agora .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cad-item.agora p{font-weight:700}
.cad-item .fiz{
  border:1px solid var(--accent);background:transparent;color:var(--accent);
  border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;flex:none;
}

/* ---------- painel ---------- */
.rosca{display:flex;justify-content:center;margin:20px 0 4px}
.rosca svg{width:190px;height:190px;overflow:visible}
.rosca .tronco{fill:none;stroke:var(--line-2);stroke-width:26}
.rosca .fatia{fill:none;stroke-width:26;transition:stroke-width .15s ease}
.rosca .centro-n{font-family:var(--display);font-weight:800;font-size:34px;fill:var(--ink);letter-spacing:-.03em}
.rosca .centro-t{font-size:10.5px;fill:var(--muted-c);font-weight:700;letter-spacing:.09em;text-transform:uppercase}

.legenda{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.leg{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line-2)}
.leg:last-child{border-bottom:none}
.leg .marca{width:12px;height:12px;border-radius:3px;flex:none}
.leg .nome{flex:1;font-size:14.5px;font-weight:600}
.leg .qtd{font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.leg .pct{font-size:12.5px;color:var(--muted-c);font-weight:700;font-variant-numeric:tabular-nums;width:44px;text-align:right}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:9px;margin-top:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-c);font-weight:700;margin-top:3px}
.kpi small{display:block;font-size:11.5px;color:var(--muted-c);margin-top:5px;line-height:1.35}

.veredito{margin-top:22px;padding:15px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.veredito .selo{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;padding:4px 11px;border-radius:99px;margin-bottom:10px;
}
.veredito.bom .selo{background:var(--win-soft);color:var(--win)}
.veredito.ok .selo{background:var(--today-soft);color:var(--today)}
.veredito.ruim .selo{background:var(--overdue-soft);color:var(--overdue)}
.veredito p{margin:0 0 9px;font-size:14.5px;line-height:1.55}
.veredito p:last-child{margin-bottom:0}
.veredito .ressalva{font-size:13px;color:var(--muted-c);border-top:1px solid var(--line-2);padding-top:10px;margin-top:11px}

.indic{display:flex;align-items:center;gap:10px;margin-top:9px}
.indic label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap;text-transform:none;letter-spacing:0;color:var(--ink)}
.indic input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.indic input[type=text]{flex:1;min-width:0}

/* ---------- busca ---------- */
.busca{position:relative;margin-top:18px}
.busca input{
  width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);font-size:15.5px;
}
.busca input::placeholder{color:var(--muted-c)}

.filtros{display:flex;gap:6px;overflow-x:auto;margin-top:11px;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:99px;
  padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:max(18px,calc(50vw - 300px + 18px));
  bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);
  font-size:30px;line-height:1;font-weight:400;box-shadow:0 6px 22px rgba(192,43,96,.42);
  display:flex;align-items:center;justify-content:center;padding-bottom:3px;
}
.fab:active{transform:scale(.94)}

/* ---------- sheet ---------- */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(20,18,26,.5);
  opacity:0;pointer-events:none;transition:opacity .18s ease;backdrop-filter:blur(2px);
}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:20px 20px 0 0;box-shadow:var(--shadow-sheet);
  max-height:92vh;overflow-y:auto;transform:translateY(101%);
  transition:transform .22s cubic-bezier(.32,.72,0,1);
  padding:0 var(--sp) calc(26px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.sheet.open{transform:translateY(0)}
.sheet-in{max-width:568px;margin:0 auto}
.sheet-h{
  position:sticky;top:0;background:var(--surface);padding:14px 0 12px;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-2);
}
.sheet-h h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;line-height:1.2}
.x{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:19px;color:var(--ink-2);flex:none;line-height:1}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 0}

.campo{display:flex;flex-direction:column;gap:6px;margin-top:15px}
.campo label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-c)}
.campo input,.campo select,.campo textarea{
  width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface-2);font-size:16px;
}
.campo textarea{min-height:74px;resize:vertical;line-height:1.5}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dica{font-size:12px;color:var(--muted-c);margin-top:5px;line-height:1.45}

.etapas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.et{
  border:1px solid var(--line);background:var(--surface-2);border-radius:99px;
  padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;
}
.et .bola{width:7px;height:7px;border-radius:50%;background:var(--et,var(--s-novo))}
.et[aria-pressed="true"]{background:var(--et);border-color:var(--et);color:#fff}
:root[data-theme="dark"] .et[aria-pressed="true"],
:root:not([data-theme="light"]) .et[aria-pressed="true"]{color:#151219}
.et[aria-pressed="true"] .bola{background:currentColor}

.acoes-rapidas{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.qb{
  border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);
  padding:8px 11px;font-size:13px;font-weight:600;color:var(--ink-2);
}

.linha-btns{display:flex;gap:10px;margin-top:22px}
.btn{
  flex:1;border-radius:var(--r-sm);padding:14px 16px;font-size:15.5px;font-weight:700;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);
}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.perigo{color:var(--overdue);border-color:color-mix(in srgb,var(--overdue) 30%,transparent);background:transparent;flex:none;padding:14px 18px}

.hist{margin-top:24px;border-top:1px solid var(--line-2);padding-top:16px}
.hist h3{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0 0 11px;font-weight:600}
.nota{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px;line-height:1.5}
.nota:last-child{border-bottom:none}
.nota time{font-size:11.5px;font-weight:700;color:var(--muted-c);font-variant-numeric:tabular-nums;flex:none;width:52px;padding-top:2px}
.nota p{margin:0;white-space:pre-wrap;word-break:break-word}

.copiabox{width:100%;margin-top:11px;min-height:150px;padding:11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-family:var(--body);line-height:1.5}

.toast{
  position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s ease;box-shadow:var(--shadow);
  max-width:calc(100vw - 40px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.rodape{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.rodape button{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);
  padding:9px 13px;font-size:13px;font-weight:600;color:var(--ink-2);
}
</style>

<template id="app-shell">
  <header class="top">
    <div class="top-in">
      <div class="brandrow">
        <h1 class="brand">Funil Vivo</h1>
        <div class="saved" id="estado-salvo"></div>
      </div>
      <div class="stats" id="stats"></div>
      <nav class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-aba="hoje">Hoje <span class="n" id="n-hoje"></span></button>
        <button class="tab" role="tab" data-aba="funil">Funil <span class="n" id="n-funil"></span></button>
        <button class="tab" role="tab" data-aba="pessoas">Pessoas <span class="n" id="n-pessoas"></span></button>
        <button class="tab" role="tab" data-aba="painel">Painel</button>
      </nav>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <button class="fab" id="fab" aria-label="Adicionar pessoa">+</button>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-titulo">
    <div class="grab"></div>
    <div class="sheet-in" id="sheet-in"></div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</template>

<div id="app"></div>

<script type="application/json" id="crm-data">{"v":1,"savedAt":null,"pessoas":[]}</script>

<script id="app-js">
(function(){
"use strict";

/* ============ modelo ============ */
var ETAPAS=[
  {id:"novo",nome:"Novo lead",curto:"Novo",cor:"--s-novo"},
  {id:"contato",nome:"Contato feito",curto:"Contato",cor:"--s-contato"},
  {id:"conversa",nome:"Conversa marcada",curto:"Conversa",cor:"--s-conversa"},
  {id:"proposta",nome:"Proposta enviada",curto:"Proposta",cor:"--s-proposta"},
  {id:"ganho",nome:"Fechado",curto:"Fechado",cor:"--s-ganho"},
  {id:"perdido",nome:"Não rolou",curto:"Não rolou",cor:"--s-perdido"}
];
var ATIVAS=["novo","contato","conversa","proposta"];
var TIPOS=[{id:"agencia",nome:"Agência"},{id:"mentoria",nome:"Mentoria"}];
var ORIGENS=["Instagram","Tráfego pago","Indicação","Evento","WhatsApp","LinkedIn","Site","Lista fria","Outro"];
var LS="funil-vivo-v1";

function etapa(id){for(var i=0;i<ETAPAS.length;i++){if(ETAPAS[i].id===id)return ETAPAS[i];}return ETAPAS[0];}
function ativa(p){return ATIVAS.indexOf(p.etapa)>=0;}
function sincroniza(p){
  if(p.etapa==="perdido"){p.cadencia=[];return;}
  if(!p.cadencia||!p.cadencia.length)return;
  var prox=null;
  for(var i=0;i<p.cadencia.length;i++){if(!p.cadencia[i].feito){prox=p.cadencia[i];break;}}
  if(prox){p.proximaData=prox.data;p.proximaOque=prox.oque;}
  else if(p.proximaOque===""||/^\d/.test(p.proximaOque)===false){p.proximaData="";p.proximaOque="";}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ============ datas ============ */
function hojeISO(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function maisDias(n){
  var d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dm(iso){if(!iso)return"";var p=iso.split("-");return p[2]+"/"+p[1];}
function difDias(iso){
  if(!iso)return null;
  var a=new Date(hojeISO()+"T00:00:00"), b=new Date(iso+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function quando(iso){
  var d=difDias(iso);
  if(d===null)return"";
  if(d<-1)return Math.abs(d)+" dias atrás";
  if(d===-1)return"ontem";
  if(d===0)return"hoje";
  if(d===1)return"amanhã";
  if(d<=7)return"em "+d+" dias";
  return dm(iso);
}
function moeda(v){
  if(v===null||v===undefined||v==="")return"";
  return "R$ "+Number(v).toLocaleString("pt-BR",{maximumFractionDigits:0});
}

/* ============ estado ============ */
var estado, pendente=false, somenteLeitura=false, api=null, timer=null, salvando=false;

function normaliza(s){
  if(!s||!Array.isArray(s.pessoas))s={v:1,savedAt:null,pessoas:[]};
  if(!s.evento||!s.evento.data)s.evento=null;
  s.pessoas=s.pessoas.map(function(p){
    return {
      id:p.id||uid(), nome:p.nome||"Sem nome", empresa:p.empresa||"",
      contato:p.contato||"", origem:p.origem||"", tipo:p.tipo==="mentoria"?"mentoria":"agencia",
      etapa:etapa(p.etapa).id, valor:(p.valor===0||p.valor)?Number(p.valor):null,
      proximaData:p.proximaData||"", proximaOque:p.proximaOque||"",
      notas:Array.isArray(p.notas)?p.notas:[], cadencia:Array.isArray(p.cadencia)?p.cadencia:[],
      indicadoPor:p.indicadoPor||"", deCliente:!!p.deCliente, proximaTurma:!!p.proximaTurma,
      criadoEm:p.criadoEm||new Date().toISOString()
    };
  });
  return s;
}
function carrega(){
  var emb={},loc=null;
  try{emb=JSON.parse(document.getElementById("crm-data").textContent||"{}");}catch(e){}
  try{var raw=localStorage.getItem(LS);if(raw)loc=JSON.parse(raw);}catch(e){}
  emb=normaliza(emb);
  if(loc){
    loc=normaliza(loc);
    var t1=loc.savedAt?Date.parse(loc.savedAt):0, t2=emb.savedAt?Date.parse(emb.savedAt):0;
    if(t1>t2){estado=loc;pendente=true;return;}
  }
  estado=emb;pendente=false;
  estado.pessoas.forEach(sincroniza);
  guardaLocal();
}
function guardaLocal(){try{localStorage.setItem(LS,JSON.stringify(estado));}catch(e){}}

function mudou(){
  estado.savedAt=new Date().toISOString();
  pendente=true; guardaLocal(); render(); agenda();
}

/* ============ publicar ============ */
var HEAD='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'+
  '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
  '<title>Funil Vivo</title>'+
  '<link rel="preconnect" href="https://fonts.googleapis.com">'+
  '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
  '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">';

function montaDoc(){
  var css=document.getElementById("app-css").textContent;
  var shell=document.getElementById("app-shell").innerHTML;
  var js=document.getElementById("app-js").textContent;
  var dados=JSON.stringify(estado).replace(/</g,"\\u003c");
  return HEAD+'<style id="app-css">'+css+'</style></head><body>'+
    '<template id="app-shell">'+shell+'</template><div id="app"></div>'+
    '<script type="application/json" id="crm-data">'+dados+'<\/script>'+
    '<script id="app-js">'+js+'<\/script></body></html>';
}

function agenda(){
  clearTimeout(timer);
  timer=setTimeout(function(){salva(true);},7000);
}
function ocupada(){
  if(document.getElementById("sheet").classList.contains("open"))return true;
  var a=document.activeElement;
  return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"));
}
function salva(auto){
  if(!pendente||salvando||somenteLeitura)return;
  if(auto&&ocupada()){agenda();return;}
  if(!api){render();return;}
  salvando=true;render();
  try{sessionStorage.setItem("funil-view",JSON.stringify({aba:aba,busca:busca,filtro:filtro}));}catch(e){}
  api.publish(montaDoc()).then(function(){
    salvando=false;pendente=false;guardaLocal();render();
  }).catch(function(err){
    salvando=false;
    var c=err&&err.code;
    if(c==="conflict")return;
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="capability_disabled"||c==="consent_required"){
      somenteLeitura=true;render();return;
    }
    if(c==="rate_limited"){setTimeout(function(){salva(true);},20000);render();return;}
    if(c==="too_large"){aviso="Tem cadastro demais nesta página para salvar de uma vez. Exporte e comece uma nova.";render();return;}
    aviso="Não consegui salvar agora. Seus dados estão guardados neste aparelho — toque em Salvar de novo daqui a pouco.";
    render();
  });
}

/* ============ view ============ */
var aba="hoje", busca="", filtro="todos", aviso="";
try{
  var vs=JSON.parse(sessionStorage.getItem("funil-view")||"{}");
  if(vs.aba)aba=vs.aba; if(vs.busca)busca=vs.busca; if(vs.filtro)filtro=vs.filtro;
}catch(e){}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function barraEvento(){
  if(!estado.evento||!estado.evento.data)return"";
  var d=difDias(estado.evento.data);
  if(d===null||d<0)return"";
  var txt=d===0?"é hoje":(d===1?"é amanhã":"faltam "+d+" dias");
  return '<div class="conta'+(d<=2?" quente":"")+'"><b>'+esc(estado.evento.nome)+'</b>'+
    '<span>'+txt+' · '+esc(dm(estado.evento.data))+'</span></div>';
}
function grupos(){
  var atrasado=[],hoje=[],semana=[],depois=[],sem=[];
  estado.pessoas.forEach(function(p){
    if(!p.proximaData){ if(ativa(p))sem.push(p); return; }
    var d=difDias(p.proximaData);
    if(d<0)atrasado.push(p); else if(d===0)hoje.push(p);
    else if(d<=7)semana.push(p); else depois.push(p);
  });
  var ord=function(a,b){return (a.proximaData||"9999").localeCompare(b.proximaData||"9999");};
  atrasado.sort(ord);hoje.sort(ord);semana.sort(ord);depois.sort(ord);
  sem.sort(function(a,b){return b.criadoEm.localeCompare(a.criadoEm);});
  return {atrasado:atrasado,hoje:hoje,semana:semana,depois:depois,sem:sem};
}

function cardHTML(p){
  var e=etapa(p.etapa), d=difDias(p.proximaData), cls="", txt="";
  if(!p.proximaData){cls="vazio";txt="sem próximo passo";}
  else{
    cls = d<0?"atrasado":(d===0?"hoje":"");
    txt = '<span class="quando">'+esc(quando(p.proximaData))+'</span> · '+esc(p.proximaOque||"retomar");
  }
  var sub=[];
  if(p.empresa)sub.push(esc(p.empresa));
  if(p.origem)sub.push(esc(p.origem));
  if(p.proximaTurma)sub.push("próxima turma");
  if(p.indicadoPor)sub.push("indicada por "+esc(p.indicadoPor)+(p.deCliente?" (cliente)":""));
  return '<button class="card" data-id="'+p.id+'" style="--stage:var('+e.cor+')">'+
    '<div class="card-top"><h3>'+esc(p.nome)+'</h3>'+
      (p.valor?'<span class="valor">'+esc(moeda(p.valor))+'</span>':'')+'</div>'+
    '<div class="meta">'+
      '<span class="pill"><span class="bola"></span>'+esc(e.curto)+'</span>'+
      '<span class="pill tipo">'+(p.tipo==="mentoria"?"Mentoria":"Agência")+'</span>'+
      (sub.length?'<span>'+sub.join(" · ")+'</span>':'')+
    '</div>'+
    '<div class="acao '+cls+'">'+(txt||"")+'</div>'+
  '</button>';
}

function grupoHTML(titulo,lista,extra){
  if(!lista.length)return"";
  return '<section class="grupo '+(extra||"")+'">'+
    '<div class="grupo-h"><h2>'+esc(titulo)+'</h2><span class="cnt">'+lista.length+'</span><span class="rule"></span></div>'+
    '<div class="cards">'+lista.map(cardHTML).join("")+'</div></section>';
}

function viewHoje(){
  var g=grupos(), h="";
  var urg=g.atrasado.length+g.hoje.length;
  if(urg){
    h+='<div class="alarme"><span class="sino">🔔</span><div>'+
       '<b>'+urg+(urg===1?" pessoa esperando":" pessoas esperando")+'</b>'+
       '<span>'+(g.atrasado.length?g.atrasado.length+" atrasada"+(g.atrasado.length>1?"s":"")+" · ":"")+
       g.hoje.length+' para hoje</span></div></div>';
  }
  h+=grupoHTML("Atrasado",g.atrasado,"urgente");
  h+=grupoHTML("Hoje",g.hoje,"hoje");
  h+=grupoHTML("Próximos 7 dias",g.semana);
  h+=grupoHTML("Sem próximo passo",g.sem);
  h+=grupoHTML("Mais para frente",g.depois);
  if(!h){
    h='<div class="vazio-msg" style="margin-top:26px"><b>Nada te esperando.</b>'+
      (estado.pessoas.length?"Todo mundo do funil está com o próximo passo agendado.":"Toque no + e cadastre a primeira pessoa que você está prospectando.")+'</div>';
  }
  return h;
}

function viewFunil(){
  var h="";
  ETAPAS.forEach(function(e){
    var lista=estado.pessoas.filter(function(p){return p.etapa===e.id;});
    if(!lista.length)return;
    lista.sort(function(a,b){return (a.proximaData||"9999").localeCompare(b.proximaData||"9999");});
    var total=lista.reduce(function(s,p){return s+(p.valor||0);},0);
    h+='<section class="grupo">'+
      '<div class="grupo-h"><h2>'+esc(e.nome)+'</h2><span class="cnt">'+lista.length+
      (total?" · "+esc(moeda(total)):"")+'</span><span class="rule"></span></div>'+
      '<div class="cards">'+lista.map(cardHTML).join("")+'</div></section>';
  });
  if(!h)h='<div class="vazio-msg" style="margin-top:26px"><b>Funil vazio.</b>Toque no + para começar.</div>';
  return h;
}

function viewPessoas(){
  var q=busca.trim().toLowerCase();
  var lista=estado.pessoas.filter(function(p){
    if(filtro==="ativos"&&!ativa(p))return false;
    if(filtro==="agencia"&&p.tipo!=="agencia")return false;
    if(filtro==="mentoria"&&p.tipo!=="mentoria")return false;
    if(filtro==="ganho"&&p.etapa!=="ganho")return false;
    if(filtro==="proxima"&&!p.proximaTurma)return false;
    if(!q)return true;
    return [p.nome,p.empresa,p.contato,p.origem].join(" ").toLowerCase().indexOf(q)>=0;
  });
  lista.sort(function(a,b){return a.nome.localeCompare(b.nome,"pt-BR");});
  var chips=[["todos","Todos"],["ativos","No funil"],["agencia","Agência"],["mentoria","Mentoria"],["ganho","Fechados"],["proxima","Próxima turma"]];
  return '<div class="busca"><input type="search" id="q" placeholder="Buscar por nome, empresa, origem…" value="'+esc(busca)+'"></div>'+
    '<div class="filtros">'+chips.map(function(c){
      return '<button class="chip" data-filtro="'+c[0]+'" aria-pressed="'+(filtro===c[0])+'">'+c[1]+'</button>';
    }).join("")+'</div>'+
    (lista.length?'<div class="cards" style="margin-top:16px">'+lista.map(cardHTML).join("")+'</div>'
      :'<div class="vazio-msg" style="margin-top:22px"><b>Nada encontrado.</b>Tente outro termo ou outro filtro.</div>')+
    '<div class="rodape">'+
      '<button data-acao="copiar-hoje">Copiar lista de hoje</button>'+
      '<button data-acao="exportar">Exportar planilha</button>'+
    '</div>';
}

function painelDados(){
  var t=estado.pessoas.length;
  var semResp=estado.pessoas.filter(function(p){return p.etapa==="novo"||p.etapa==="contato";}).length;
  var conversa=estado.pessoas.filter(function(p){return p.etapa==="conversa"||p.etapa==="proposta";}).length;
  var fechou=estado.pessoas.filter(function(p){return p.etapa==="ganho";}).length;
  var caiu=estado.pessoas.filter(function(p){return p.etapa==="perdido";}).length;
  var faturado=estado.pessoas.reduce(function(a,p){return a+(p.etapa==="ganho"?(p.valor||0):0);},0);
  return {total:t,semResp:semResp,conversa:conversa,fechou:fechou,caiu:caiu,
          responderam:conversa+fechou+caiu,faturado:faturado};
}

function rosca(fatias,total){
  var R=62,C=2*Math.PI*R,gap=4,acc=0,segs="";
  fatias.forEach(function(f){
    if(!f.n)return;
    var comp=(f.n/total)*C, vis=Math.max(comp-gap,1);
    segs+='<circle class="fatia" cx="80" cy="80" r="'+R+'" stroke="var('+f.cor+')" '+
      'stroke-dasharray="'+vis.toFixed(2)+' '+(C-vis).toFixed(2)+'" '+
      'stroke-dashoffset="'+(-acc).toFixed(2)+'" stroke-linecap="butt">'+
      '<title>'+esc(f.nome)+': '+f.n+' de '+total+'</title></circle>';
    acc+=comp;
  });
  return '<div class="rosca"><svg viewBox="0 0 160 160" role="img" aria-label="Distribuição dos leads">'+
    '<g transform="rotate(-90 80 80)"><circle class="tronco" cx="80" cy="80" r="'+R+'"></circle>'+segs+'</g>'+
    '<text class="centro-n" x="80" y="78" text-anchor="middle" dominant-baseline="middle">'+total+'</text>'+
    '<text class="centro-t" x="80" y="97" text-anchor="middle">leads</text></svg></div>';
}

function veredito(d){
  if(!d.total)return"";
  var tr=d.responderam/d.total*100, tf=d.fechou/d.total*100;
  var nivel,selo,texto;
  if(tr<20){nivel="ruim";selo="Precisa de atenção";
    texto="Menos de um quinto das pessoas respondeu. Quando a resposta é tão baixa, o problema quase nunca é a lista — é a primeira mensagem ou a hora do disparo.";}
  else if(tr<40){nivel="ok";selo="Dentro do esperado";
    texto="A taxa de resposta está na faixa comum para abordagem por WhatsApp. Dá para melhorar mexendo na primeira frase, mas não há nada quebrado.";}
  else {nivel="bom";selo="Está bom";
    texto="Mais de 4 em cada 10 responderam. Isso é resposta alta para prospecção — a sua abordagem está funcionando.";}

  var t2;
  if(d.fechou===0) t2="Ainda sem fechamento. Enquanto houver gente em conversa, é cedo para tirar conclusão: fechamento costuma vir depois do terceiro ou quarto contato, não do primeiro.";
  else if(tf<2) t2="A conversão para venda está abaixo de 2%, que é o piso do que se costuma ver em tráfego pago frio. Vale olhar o preço e a oferta.";
  else if(tf<5) t2="Conversão de "+tf.toFixed(1)+"% sobre o total — dentro do que se espera de tráfego pago frio, que costuma andar entre 2% e 5%.";
  else {nivel=(nivel==="ruim")?"ok":"bom";
    t2="Conversão de "+tf.toFixed(1)+"% sobre o total. Isso está acima da faixa habitual de tráfego pago frio (2% a 5%) — é resultado bom.";}

  var res="";
  if(d.total<20) res="Ressalva importante: são só "+d.total+" pessoas. Com esse tamanho, uma venda a mais ou a menos muda a porcentagem em vários pontos. Trate como sinal, não como conclusão — a partir de umas 30 pessoas o número começa a valer.";
  else res="Com "+d.total+" pessoas o número já começa a ter peso, mas continue olhando a tendência entre turmas, não um retrato isolado.";

  var seloTxt={bom:"Está bom",ok:"Dentro do esperado",ruim:"Precisa de atenção"}[nivel];
  return '<div class="veredito '+nivel+'"><span class="selo">'+seloTxt+'</span>'+
    '<p>'+texto+'</p><p>'+t2+'</p><p class="ressalva">'+res+'</p></div>';
}

function viewPainel(){
  var d=painelDados();
  if(!d.total)return '<div class="vazio-msg" style="margin-top:26px"><b>Sem dados ainda.</b>Cadastre pessoas e o painel se monta sozinho.</div>';
  var fatias=[
    {nome:"Sem resposta",n:d.semResp,cor:"--v1"},
    {nome:"Em conversa",n:d.conversa,cor:"--v2"},
    {nome:"Fechou",n:d.fechou,cor:"--v3"},
    {nome:"Não rolou",n:d.caiu,cor:"--v4"}
  ];
  var pct=function(n){return d.total?Math.round(n/d.total*100):0;};
  var leg=fatias.map(function(f){
    return '<div class="leg"><span class="marca" style="background:var('+f.cor+')"></span>'+
      '<span class="nome">'+esc(f.nome)+'</span><span class="qtd">'+f.n+'</span>'+
      '<span class="pct">'+pct(f.n)+'%</span></div>';
  }).join("");

  return rosca(fatias,d.total)+'<div class="legenda">'+leg+'</div>'+
    '<div class="kpis">'+
      '<div class="kpi"><b>'+pct(d.responderam)+'%</b><span>responderam</span><small>'+d.responderam+' de '+d.total+' pessoas</small></div>'+
      '<div class="kpi"><b>'+(d.total?(d.fechou/d.total*100).toFixed(1):0)+'%</b><span>viraram venda</span><small>'+d.fechou+' de '+d.total+'</small></div>'+
      '<div class="kpi"><b>'+esc(moeda(d.faturado)||"R$ 0")+'</b><span>fechado</span><small>soma do que já é venda</small></div>'+
    '</div>'+veredito(d);
}

function render(){
  var ativos=estado.pessoas.filter(ativa);
  var g=grupos();
  var precisa=g.atrasado.length+g.hoje.length;
  var emJogo=ativos.reduce(function(s,p){return s+(p.valor||0);},0);

  var st=document.getElementById("stats");
  st.innerHTML=
    '<div class="stat"><b>'+ativos.length+'</b><span>no funil</span></div>'+
    (emJogo?'<div class="stat"><b>'+esc(moeda(emJogo))+'</b><span>em jogo</span></div>':'')+
    '<div class="stat'+(precisa?" alerta":"")+'"><b>'+precisa+'</b><span>precisam de você</span></div>';

  document.getElementById("n-hoje").textContent=precisa?"("+precisa+")":"";
  document.getElementById("n-funil").textContent=ativos.length?"("+ativos.length+")":"";
  document.getElementById("n-pessoas").textContent=estado.pessoas.length?"("+estado.pessoas.length+")":"";
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
    t.setAttribute("aria-selected",t.dataset.aba===aba?"true":"false");
  });

  var es=document.getElementById("estado-salvo");
  if(somenteLeitura){
    es.innerHTML='<span class="dot off"></span>só leitura';
  }else if(salvando){
    es.innerHTML='<span class="dot pend"></span>salvando…';
  }else if(pendente){
    es.innerHTML='<span class="dot pend"></span><button class="btn-save" id="btn-salvar">Salvar</button>';
  }else{
    es.innerHTML='<span class="dot"></span>salvo';
  }

  var v=document.getElementById("view");
  var avisoHTML="";
  if(somenteLeitura)avisoHTML='<div class="aviso">Esta janela está em modo leitura — o que você mudar aqui fica só neste aparelho. Abra o link pela sua própria conta para salvar na nuvem.</div>';
  else if(aviso)avisoHTML='<div class="aviso erro">'+esc(aviso)+'</div>';
  v.innerHTML=avisoHTML+barraEvento()+(aba==="hoje"?viewHoje():aba==="funil"?viewFunil():aba==="painel"?viewPainel():viewPessoas());
}

/* ============ toast ============ */
var toastT=null;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},2600);
}

/* ============ sheet ============ */
function abreSheet(html){
  document.getElementById("sheet-in").innerHTML=html;
  document.getElementById("sheet").classList.add("open");
  document.getElementById("scrim").classList.add("open");
  document.body.style.overflow="hidden";
}
function fechaSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  document.body.style.overflow="";
  setTimeout(function(){document.getElementById("sheet-in").innerHTML="";},240);
  if(pendente)agenda();
}

function selEtapas(atual){
  return '<div class="etapas">'+ETAPAS.map(function(e){
    return '<button class="et" data-etapa="'+e.id+'" aria-pressed="'+(e.id===atual)+'" style="--et:var('+e.cor+')"><span class="bola"></span>'+esc(e.curto)+'</button>';
  }).join("")+'</div>';
}
function optOrigens(v){
  var achou=ORIGENS.indexOf(v)>=0;
  return '<option value=""></option>'+ORIGENS.map(function(o){
    return '<option'+(o===v?" selected":"")+'>'+esc(o)+'</option>';
  }).join("")+(!achou&&v?'<option selected>'+esc(v)+'</option>':"");
}

  inn.querySelector('[data-acao="criar"]').addEventListener("click",function(){

function sheetPessoa(id){
  var p=null;
  for(var i=0;i<estado.pessoas.length;i++){if(estado.pessoas[i].id===id)p=estado.pessoas[i];}
  if(!p)return;
  var notas=p.notas.slice().reverse().map(function(n){
    return '<div class="nota"><time>'+esc(dm((n.data||"").slice(0,10)))+'</time><p>'+esc(n.texto)+'</p></div>';
  }).join("");

  var proxN=-1;
  for(var j=0;j<(p.cadencia||[]).length;j++){if(!p.cadencia[j].feito){proxN=j;break;}}
  var cad="";
  if(p.cadencia&&p.cadencia.length){
    cad='<div class="hist"><h3>Cadência de retomada</h3><div class="cad">'+
      p.cadencia.map(function(c,i){
        var cls=c.feito?"feito":(i===proxN?"agora":"");
        return '<div class="cad-item '+cls+'"><span class="n">'+(i+1)+'</span>'+
          '<time>'+esc(dm(c.data))+'</time><p>'+esc(c.oque)+'</p>'+
          (i===proxN?'<button class="fiz" data-fiz="'+i+'">Fiz</button>':'')+'</div>';
      }).join("")+'</div></div>';
  }

  abreSheet(
    '<div class="sheet-h"><h2 id="sheet-titulo">'+esc(p.nome)+'</h2><button class="x" data-fecha aria-label="Fechar">×</button></div>'+
    '<div class="campo"><label>Etapa</label>'+selEtapas(p.etapa)+'</div>'+
    '<div class="campo"><label for="e-oque">Próximo passo</label><input id="e-oque" value="'+esc(p.proximaOque)+'" placeholder="O que você precisa fazer"></div>'+
    '<div class="campo"><label for="e-data">Quando</label><input id="e-data" type="date" value="'+esc(p.proximaData)+'">'+
      '<div class="acoes-rapidas">'+
        '<button class="qb" data-adia="0">hoje</button>'+
        '<button class="qb" data-adia="1">amanhã</button>'+
        '<button class="qb" data-adia="3">+3 dias</button>'+
        '<button class="qb" data-adia="7">+1 semana</button>'+
        '<button class="qb" data-adia="15">+15 dias</button>'+
      '</div></div>'+
    '<div class="campo"><label for="e-nota">Anotar o que rolou</label><textarea id="e-nota" placeholder="Falei por áudio, ela pediu proposta até sexta…"></textarea>'+
      '<div class="acoes-rapidas"><button class="qb" data-acao="anotar">Salvar anotação</button></div></div>'+
    '<div class="dupla">'+
      '<div class="campo"><label for="e-nome">Nome</label><input id="e-nome" value="'+esc(p.nome)+'"></div>'+
      '<div class="campo"><label for="e-empresa">Empresa</label><input id="e-empresa" value="'+esc(p.empresa)+'"></div>'+
    '</div>'+
    '<div class="dupla">'+
      '<div class="campo"><label for="e-contato">Contato</label><input id="e-contato" value="'+esc(p.contato)+'"></div>'+
      '<div class="campo"><label for="e-valor">Valor (R$)</label><input id="e-valor" type="number" inputmode="numeric" value="'+(p.valor||"")+'" placeholder="0"></div>'+
    '</div>'+
    '<div class="campo"><label>Guardar para depois</label>'+
      '<div class="indic"><label><input type="checkbox" id="e-proxima"'+(p.proximaTurma?" checked":"")+'> voltar na próxima turma</label></div>'+
      '<p class="dica">Marque quem disse não agora mas pode dizer sim depois. Não gera cobrança nem alarme — só entra no filtro Próxima turma.</p></div>'+
    '<div class="campo"><label>Indicação</label>'+
      '<div class="indic"><label><input type="checkbox" id="e-cliente"'+(p.deCliente?" checked":"")+'> quem indicou é meu cliente</label></div>'+
      '<input type="text" id="e-indic" value="'+esc(p.indicadoPor)+'" placeholder="nome de quem indicou" style="margin-top:9px">'+
      '<p class="dica">Isto diz respeito a quem indicou, não a esta pessoa. Quem já é cliente seu fica na etapa Fechado.</p></div>'+
    '<div class="dupla">'+
      '<div class="campo"><label for="e-tipo">Tipo</label><select id="e-tipo"><option value="agencia"'+(p.tipo==="agencia"?" selected":"")+'>Agência</option><option value="mentoria"'+(p.tipo==="mentoria"?" selected":"")+'>Mentoria</option></select></div>'+
      '<div class="campo"><label for="e-origem">Origem</label><select id="e-origem">'+optOrigens(p.origem)+'</select></div>'+
    '</div>'+
    '<div class="linha-btns">'+
      '<button class="btn pri" data-acao="salvar-pessoa">Salvar</button>'+
      '<button class="btn perigo" data-acao="apagar">Apagar</button>'+
    '</div>'+
    cad+
    (notas?'<div class="hist"><h3>Histórico</h3>'+notas+'</div>':'')
  );

  var inn=document.getElementById("sheet-in");
  var novaEtapa=p.etapa;

  inn.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-etapa]");
    if(b){
      novaEtapa=b.dataset.etapa;
      Array.prototype.forEach.call(inn.querySelectorAll("[data-etapa]"),function(x){
        x.setAttribute("aria-pressed",x.dataset.etapa===novaEtapa?"true":"false");
      });
      return;
    }
    var a=ev.target.closest("[data-adia]");
    if(a){inn.querySelector("#e-data").value=maisDias(Number(a.dataset.adia));return;}
    var fz=ev.target.closest("[data-fiz]");
    if(fz){
      var k=Number(fz.dataset.fiz), passo=p.cadencia[k];
      passo.feito=true; passo.feitoEm=new Date().toISOString();
      p.notas.push({data:new Date().toISOString(),texto:"Tentativa "+(k+1)+" feita: "+passo.oque});
      sincroniza(p);
      fechaSheet();mudou();
      toast(p.proximaData?"Feito. Próxima em "+dm(p.proximaData)+".":"Cadência encerrada.");
      return;
    }
    var n=ev.target.closest('[data-acao="anotar"]');
    if(n){
      var t=inn.querySelector("#e-nota").value.trim();
      if(!t){toast("Escreve a anotação primeiro.");return;}
      p.notas.push({data:new Date().toISOString(),texto:t});
      inn.querySelector("#e-nota").value="";
      mudou();toast("Anotado.");
      return;
    }
    if(ev.target.closest('[data-acao="salvar-pessoa"]')){
      var nome=inn.querySelector("#e-nome").value.trim();
      if(!nome){toast("O nome não pode ficar vazio.");return;}
      var vl=inn.querySelector("#e-valor").value;
      var nota=inn.querySelector("#e-nota").value.trim();
      if(nota)p.notas.push({data:new Date().toISOString(),texto:nota});
      var virouPerdido=(novaEtapa==="perdido"&&p.etapa!=="perdido");
      if(novaEtapa!==p.etapa)p.notas.push({data:new Date().toISOString(),texto:"Etapa: "+etapa(p.etapa).nome+" → "+etapa(novaEtapa).nome});
      p.nome=nome;
      p.empresa=inn.querySelector("#e-empresa").value.trim();
      p.contato=inn.querySelector("#e-contato").value.trim();
      p.origem=inn.querySelector("#e-origem").value;
      p.indicadoPor=inn.querySelector("#e-indic").value.trim();
      p.deCliente=inn.querySelector("#e-cliente").checked;
      p.proximaTurma=inn.querySelector("#e-proxima").checked;
      p.tipo=inn.querySelector("#e-tipo").value;
      p.valor=vl===""?null:Number(vl);
      p.etapa=novaEtapa;
      p.proximaOque=inn.querySelector("#e-oque").value.trim();
      p.proximaData=inn.querySelector("#e-data").value;
      if(virouPerdido){p.cadencia=[];p.proximaData="";p.proximaOque="";}
      sincroniza(p);
      fechaSheet();mudou();
      toast(virouPerdido?"Saiu do funil — retomadas canceladas. Pode marcar uma data à mão se quiser voltar nela.":"Salvo.");
      return;
    }
    if(ev.target.closest('[data-acao="apagar"]')){
      if(!confirm("Apagar "+p.nome+" de vez?"))return;
      estado.pessoas=estado.pessoas.filter(function(x){return x.id!==p.id;});
      fechaSheet();mudou();toast("Apagado.");
    }
  });
}

/* ============ copiar / exportar ============ */
function textoHoje(){
  var g=grupos(),l=[];
  function bloco(t,arr){
    if(!arr.length)return;
    l.push(t.toUpperCase());
    arr.forEach(function(p){
      l.push("• "+p.nome+(p.contato?" ("+p.contato+")":"")+" — "+(p.proximaOque||"retomar")+
        (p.proximaData?" ["+quando(p.proximaData)+"]":""));
    });
    l.push("");
  }
  bloco("Atrasado",g.atrasado);bloco("Hoje",g.hoje);bloco("Sem próximo passo",g.sem);
  return l.length?("Funil — "+dm(hojeISO())+"\n\n"+l.join("\n")).trim():"Nada pendente hoje.";
}
function csv(){
  var cab=["nome","empresa","contato","tipo","origem","etapa","valor","proximo_passo","proxima_data","criado_em","notas"];
  var esc2=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';};
  var linhas=[cab.join(",")];
  estado.pessoas.forEach(function(p){
    linhas.push([p.nome,p.empresa,p.contato,p.tipo,p.origem,etapa(p.etapa).nome,
      p.valor==null?"":p.valor,p.proximaOque,p.proximaData,p.criadoEm.slice(0,10),
      p.notas.map(function(n){return (n.data||"").slice(0,10)+": "+n.texto;}).join(" | ")
    ].map(esc2).join(","));
  });
  return "﻿"+linhas.join("\r\n");
}
function copiar(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast("Copiado — cola no WhatsApp.");},function(){caixa(txt);});
  }else caixa(txt);
}
function caixa(txt){
  abreSheet('<div class="sheet-h"><h2 id="sheet-titulo">Copie daqui</h2><button class="x" data-fecha aria-label="Fechar">×</button></div>'+
    '<p class="dica">O navegador não deixou copiar sozinho. Segure o texto, selecione tudo e copie.</p>'+
    '<textarea class="copiabox" readonly>'+esc(txt)+'</textarea>');
  setTimeout(function(){var t=document.querySelector(".copiabox");if(t){t.focus();t.select();}},250);
}
function exportar(){
  var dados=csv();
  if(!api2){caixa(dados);return;}
  api2.save({filename:"funil-"+hojeISO()+".csv",data:dados}).then(function(){
    toast("Planilha salva.");
  }).catch(function(err){
    var c=err&&err.code;
    if(c==="declined")return;
    if(c==="extension_not_enabled"||c==="rejected_extension"){
      api2.save({filename:"funil-"+hojeISO()+".txt",data:dados}).then(function(){
        toast("Salvo como .txt — é só renomear para .csv.");
      }).catch(function(){caixa(dados);});
      return;
    }
    caixa(dados);
  });
}

/* ============ ligação ============ */
var api2=null;
function liga(){
  document.getElementById("app").appendChild(
    document.getElementById("app-shell").content.cloneNode(true));

  document.getElementById("fab").addEventListener("click",sheetNovo);
  document.getElementById("scrim").addEventListener("click",fechaSheet);
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&document.getElementById("sheet").classList.contains("open"))fechaSheet();
  });
  document.getElementById("sheet").addEventListener("click",function(e){
    if(e.target.closest("[data-fecha]"))fechaSheet();
  });
  document.getElementById("tabs").addEventListener("click",function(e){
    var t=e.target.closest(".tab");
    if(t){aba=t.dataset.aba;render();window.scrollTo({top:0,behavior:"smooth"});}
  });
  document.querySelector(".top").addEventListener("click",function(e){
    if(e.target.closest("#btn-salvar")){clearTimeout(timer);salva(false);}
  });
  document.getElementById("view").addEventListener("click",function(e){
    var c=e.target.closest(".card");
    if(c){sheetPessoa(c.dataset.id);return;}
    var f=e.target.closest("[data-filtro]");
    if(f){filtro=f.dataset.filtro;render();return;}
    var a=e.target.closest("[data-acao]");
    if(!a)return;
    if(a.dataset.acao==="copiar-hoje")copiar(textoHoje());
    if(a.dataset.acao==="exportar")exportar();
  });
  document.getElementById("view").addEventListener("input",function(e){
    if(e.target.id==="q"){
      busca=e.target.value;
      var pos=e.target.selectionStart;
      render();
      var q=document.getElementById("q");
      if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(err){}}
    }
  });
  window.addEventListener("beforeunload",guardaLocal);

  render();

  if(window.claude&&window.claude.use){
    window.claude.use("artifact").then(function(a){
      api=a;
      if(!a){somenteLeitura=true;}
      render();
      if(pendente&&api)agenda();
    }).catch(function(){somenteLeitura=true;render();});
    window.claude.use("downloads").then(function(d){api2=d;});
  }else{
    somenteLeitura=true;render();
  }
}

carrega();
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",liga);
else liga();
})();
</script>
